<section class="hero" #scene aria-labelledby="hero-title">
  <div class="hero-aurora" #aurora aria-hidden="true">
    <span class="hero-aurora-wash" data-wash="0"></span>
    <span class="hero-aurora-wash" data-wash="1"></span>
    <span class="hero-aurora-wash" data-wash="2"></span>
    <span class="hero-aurora-wash hero-aurora-wash--follow" data-wash="follow"></span>
  </div>

  <div class="hero-split">
    <div class="hero-copy">
      <h1 id="hero-title" class="hero-word" [attr.aria-label]="brandName()">
        <span class="hero-letters" aria-hidden="true">
          @for (letter of brandLetters(); track $index) {
            <span class="hero-letter" [style.--i]="$index">{{ letter }}</span>
          }
        </span>
      </h1>

      <p class="hero-mission" (pointermove)="onMissionMove($event)" (pointerleave)="clearMission()">
        @for (word of missionWords; track $index) {
          <span class="mission-word" [style.--i]="$index">{{ word }}</span>{{ ' ' }}
        }
      </p>

      <div
        class="hero-tags"
        role="radiogroup"
        aria-label="Practices"
        (keydown)="onTagsKeydown($event)"
      >
        @for (lane of lanes; track lane.id) {
          <button
            #tag
            type="button"
            role="radio"
            [attr.aria-checked]="activeLane()?.id === lane.id"
            [style.--i]="$index"
            (click)="selectLane(lane)"
          >
            {{ lane.label }}
          </button>
        }
      </div>

      <div class="hero-note-wrap" [attr.data-open]="noteOpen() ? 'true' : 'false'">
        <p class="hero-note" aria-live="polite">{{ noteText() }}</p>
      </div>

      <button type="button" class="hero-more" [hidden]="!activeLane()" (click)="seeServices()">
        See these services
      </button>
    </div>

    <button
      type="button"
      class="hero-emblem"
      [attr.aria-label]="'Play the ' + brandName() + ' mark again'"
      (pointerdown)="onEmblemDown($event)"
      (pointermove)="onEmblemMove($event)"
      (pointerup)="onEmblemUp()"
      (pointercancel)="onEmblemUp()"
      (click)="onEmblemClick()"
    >
      <span class="hero-emblem-in">
        <span class="hero-emblem-shift">
          <app-logo-mark />
        </span>
      </span>
      <span class="hero-drag-hint" [class.is-gone]="hintGone()">Drag to tilt</span>
    </button>
  </div>
</section>
