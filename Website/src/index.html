<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Jencolink — Software Engineering Studio</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Jencolink designs, builds, and scales intelligent software: custom web applications, business management systems, eCommerce, and automation — engineered with care."
    />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#10063F" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f3f4fa" />
    <meta property="og:title" content="Jencolink — Software Engineering Studio" />
    <meta
      property="og:description"
      content="Building software that powers a better tomorrow. Custom web apps, business systems, and automation."
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <script src="runtime-config.js"></script>
    <!-- Apply the persisted theme before first paint to avoid a flash. Mirrors ThemeService. -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('jencolink-theme');
          if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
        } catch (e) {}
      })();
    </script>
    <script>
      (function () {
        try {
          if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
          document.documentElement.classList.add('hero-sequencing');
          setTimeout(function () {
            var root = document.documentElement;
            if (!root.classList.contains('hero-ready')) root.classList.remove('hero-sequencing');
          }, 4000);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
