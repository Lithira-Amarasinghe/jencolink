<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Jencolink — Software Solutions</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Jencolink designs and builds custom web apps, business management systems, e-commerce platforms, cloud solutions, and workflow automation."
    />
    <link rel="canonical" href="https://jencolink.com/" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#10063F" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f3f4fa" />
    <meta property="og:title" content="Jencolink — Software Solutions" />
    <meta
      property="og:description"
      content="Jencolink designs and builds custom web apps, business management systems, e-commerce platforms, cloud solutions, and workflow automation."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://jencolink.com/" />
    <meta property="og:site_name" content="Jencolink" />
    <meta property="og:image" content="https://jencolink.com/social-preview-square.png" />
    <meta property="og:image:width" content="630" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Jencolink logo" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Jencolink — Software Solutions" />
    <meta name="twitter:image" content="https://jencolink.com/social-preview.png" />
    <meta name="twitter:image:alt" content="Jencolink logo and wordmark" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Organization",
            "@id": "https://jencolink.com/#organization",
            "name": "Jencolink",
            "url": "https://jencolink.com/",
            "logo": "https://jencolink.com/logo.png"
          },
          {
            "@type": "WebSite",
            "@id": "https://jencolink.com/#website",
            "name": "Jencolink",
            "url": "https://jencolink.com/",
            "publisher": { "@id": "https://jencolink.com/#organization" }
          }
        ]
      }
    </script>
    <script src="runtime-config.js"></script>
    <!-- Apply the persisted theme before first paint to avoid a flash. Mirrors ThemeService. -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('jencolink-theme');
          if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
        } catch (e) {}
      })();
    </script>
    <script>
      (function () {
        try {
          if (!window.matchMedia(
            '(min-width: 761px) and (min-height: 650px) and (hover: hover) and (pointer: fine) and (prefers-reduced-motion: no-preference)'
          ).matches) return;
          document.documentElement.classList.add('hero-sequencing');
          setTimeout(function () {
            var root = document.documentElement;
            if (!root.classList.contains('hero-ready')) root.classList.remove('hero-sequencing');
          }, 4000);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
