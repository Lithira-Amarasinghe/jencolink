name: Frontend (Angular)

on:
  push:
    branches:
      - master
    paths:
      - 'Website/**'
      - '.github/workflows/frontend.yml'
  pull_request:
    branches:
      - master
    paths:
      - 'Website/**'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  AZURE_SWA_NAME: ${{ secrets.AZURE_SWA_NAME }}
  AZURE_RESOURCE_GROUP: ${{ secrets.AZURE_RESOURCE_GROUP }}

jobs:
  build:
    name: Build Angular App
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Website

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'Website/package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint 2>/dev/null || true

      - name: Run tests
        run: npm test -- --watch=false --browsers=ChromeHeadless 2>/dev/null || true

      - name: Build production
        run: npm run build -- --configuration production

      # Pull requests must build without Key Vault. The deploy job replaces
      # this file with the live values before upload.
      - name: Write placeholder runtime config
        run: |
          mkdir -p dist/gencolink/browser
          cat > dist/gencolink/browser/runtime-config.js << 'EOF'
          window.__SANITY_PROJECT_ID__ = '';
          window.__SANITY_DATASET__ = 'production';
          window.__WEB3FORMS_ACCESS_KEY__ = '';
          window.__APP_ENV__ = 'production';
          EOF

      - name: Copy staticwebapp.config.json to browser dir
        run: |
          mkdir -p dist/gencolink/browser
          cp staticwebapp.config.json dist/gencolink/browser/

      - name: Verify build artifacts
        run: |
          ls -la dist/gencolink/
          echo "Build size: $(du -sh dist/gencolink/)"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: angular-build
          path: Website/dist/gencolink/
          retention-days: 7

  deploy:
    name: Deploy to Azure Static Web App
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: angular-build
          path: ./build

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Write runtime config from Key Vault
        env:
          VAULT_NAME: ${{ secrets.AZURE_KEY_VAULT_NAME }}
        run: |
          set -euo pipefail
          if [ -z "${VAULT_NAME}" ]; then
            echo "GitHub secret AZURE_KEY_VAULT_NAME is missing. Run terraform apply first."
            exit 1
          fi
          python3 - << 'PY'
          import os
          import subprocess
          from pathlib import Path

          vault = os.environ["VAULT_NAME"]

          def read_secret(name: str) -> str:
              result = subprocess.run(
                  [
                      "az", "keyvault", "secret", "show",
                      "--vault-name", vault,
                      "--name", name,
                      "--query", "value",
                      "-o", "tsv",
                  ],
                  check=True,
                  capture_output=True,
                  text=True,
              )
              return result.stdout.strip()

          def js(value: str) -> str:
              return value.replace("\\", "\\\\").replace("'", "\\'").replace("\n", "").replace("\r", "")

          project_id = read_secret("sanity-project-id")
          dataset = read_secret("sanity-dataset")
          access_key = read_secret("web3forms-access-key")

          def missing(value: str) -> bool:
              return value == "" or value == "pending"

          if missing(project_id):
              raise SystemExit(
                  "Key Vault secret sanity-project-id is empty or still 'pending'. "
                  "Set it in the vault, then re-run this workflow."
              )
          if missing(access_key):
              raise SystemExit(
                  "Key Vault secret web3forms-access-key is empty or still 'pending'. "
                  "Set it in the vault, then re-run this workflow."
              )
          if missing(dataset):
              dataset = "production"

          target = Path("build/browser/runtime-config.js")
          target.write_text(
              "window.__SANITY_PROJECT_ID__ = '%s';\n"
              "window.__SANITY_DATASET__ = '%s';\n"
              "window.__WEB3FORMS_ACCESS_KEY__ = '%s';\n"
              "window.__APP_ENV__ = 'production';\n"
              % (js(project_id), js(dataset), js(access_key))
          )
          print("runtime-config.js written from Key Vault (values not printed).")
          PY

      - name: Deploy to Static Web App
        uses: azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_SWA_DEPLOYMENT_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: 'upload'
          app_location: 'build/browser'
          output_location: ''

      - name: Verify deployment
        run: |
          echo "Frontend deployed to: https://${{ env.AZURE_SWA_NAME }}.azurestaticapps.net"
          curl -f -I "https://${{ env.AZURE_SWA_NAME }}.azurestaticapps.net/" || echo "Warning: Could not verify deployment URL"
